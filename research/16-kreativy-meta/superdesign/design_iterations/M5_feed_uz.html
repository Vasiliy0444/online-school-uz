<!doctype html><html><head><meta charset='utf-8'><link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Condensed:wght@400;500;700;800&family=Courier+Prime:wght@400;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&family=Montserrat+Alternates:wght@600;700;800&family=Roboto:wght@300;400;500;700;900&family=Caveat:wght@500;600;700&family=PT+Serif:wght@400;700&display=block'><style>html,body{margin:0;padding:0}body{width:1080px;height:1350px;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}*{box-sizing:border-box}.hl{display:inline;-webkit-box-decoration-break:clone;box-decoration-break:clone}.strike{position:relative;white-space:nowrap;display:inline-block}.strike:after{content:'';position:absolute;left:-5%;right:-5%;top:50%;height:.1em;background:#ff2a2a;transform:rotate(-7deg);border-radius:.05em}.nb{white-space:nowrap}.abs{position:absolute}

body{background:#fff}</style></head><body><div class="c" style="padding:0 70px"><div data-box data-maxh="470" style="font:900 92px/1.06 Montserrat,sans-serif;color:#111;max-width:940px">AI orqali pul ishlash kursini tarqatamiz!</div><div style="margin-top:50px;font:700 72px/1 Montserrat,sans-serif;color:#9a9a9a"><span class="strike">3 mln so‘m</span></div><div data-box data-maxw="940" style="margin-top:26px;font:900 140px/1 Montserrat,sans-serif;color:#E5197F;letter-spacing:-.02em;white-space:nowrap">Bepul!!</div><div style="margin-top:50px;font:800 52px/1 Montserrat,sans-serif;color:#fff;background:#111;border-radius:999px;padding:26px 70px">Oling 👇</div></div>
<script>
function contentH(el){
  const gap = parseFloat(getComputedStyle(el).rowGap) || 0; const kids = Array.from(el.children);
  return kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0) + gap * Math.max(0, kids.length - 1);
}
function fitCol(el){
  const max = el.clientHeight; let fs = parseFloat(getComputedStyle(el).fontSize); let g = 0;
  while (contentH(el) > max - 24 && g < 90) { fs *= 0.97; el.style.fontSize = fs + 'px'; g++; }
}
function fitBox(el){
  const maxh = parseFloat(el.dataset.maxh || 1e9); const maxw = parseFloat(el.dataset.maxw || 1e9);
  let fs = parseFloat(getComputedStyle(el).fontSize); let g = 0;
  while ((el.offsetHeight > maxh + 1 || el.scrollWidth > maxw + 1) && g < 90) { fs *= 0.97; el.style.fontSize = fs + 'px'; g++; }
}
function fillBelow(){
  const hw = document.querySelector('.headwrap'); const img = document.querySelector('img[data-fill]');
  if (!hw || !img) return;
  const [x0, y0, x1, y1, iw, ih, cx, drop, maxh] = img.dataset.fill.split(',').map(Number);
  const H = document.body.clientHeight; const top = hw.getBoundingClientRect().bottom + 36;
  const contentH = Math.min(maxh, H - top + drop); const sc = contentH / (y1 - y0);
  img.style.width = (iw * sc) + 'px'; img.style.top = (H + drop - contentH - y0 * sc) + 'px'; img.style.left = (cx - (x0 + x1) / 2 * sc) + 'px';
  const tag = document.querySelector('.tag'); if (tag && !tag.dataset.fixed) tag.style.top = (H + drop - contentH + contentH * 0.30) + 'px';
}
document.fonts.ready.then(() => {
  document.querySelectorAll('[data-box]').forEach(fitBox);
  document.querySelectorAll('[data-col]').forEach(fitCol);
  fillBelow();
  document.body.dataset.ready = 1;
});
</script>
</body></html>
