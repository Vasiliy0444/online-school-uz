args = ["/Users/Bel-a/claude-mcps/superdesign-mcp-claude-code/dist/index.js"]

# Official Meta Ads MCP. Local preparation policy; authentication is pending.
# Tool names below are from Meta's public documentation. Upload tools will be
# added only after authenticated tools/list and inspection of their schemas.
[mcp_servers.meta-ads-drafts]
url = "https://mcp.facebook.com/ads"
enabled = true
http_headers_helper = "/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13 '/Users/Bel-a/Desktop/CURSOR/БИЗНЕС/Онлайн школа УЗ/infra/meta-ads/credentials.py' headers"
